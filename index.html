<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빙수 월드 투어 — 에셋 갤러리</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --md-sys-color-surface: #FFFBFE;
      --md-sys-color-surface-variant: #E7E0EC;
      --md-sys-color-on-surface: #1C1B1F;
      --md-sys-color-on-surface-variant: #49454F;
      --md-sys-color-primary: #6750A4;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-outline: #79747E;
      --md-sys-elevation-2: 0px 1px 2px rgba(0,0,0,0.3), 0px 2px 6px 2px rgba(0,0,0,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--md-sys-color-surface); color: var(--md-sys-color-on-surface); }
    header { padding: 24px 32px; border-bottom: 1px solid var(--md-sys-color-surface-variant); }
    header h1 { font-size: 22px; font-weight: 600; }
    header p { font-size: 14px; color: var(--md-sys-color-on-surface-variant); margin-top: 4px; }

    .controls {
      padding: 20px 32px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--md-sys-color-surface-variant);
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 200px;
      max-width: 400px;
    }
    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--md-sys-color-on-surface-variant);
    }
    #search {
      width: 100%;
      padding: 10px 12px 10px 40px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 100px;
      font-size: 14px;
      font-family: inherit;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      outline: none;
    }
    #search:focus { border-color: var(--md-sys-color-primary); }

    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn {
      padding: 6px 16px;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 100px;
      font-size: 13px;
      font-family: inherit;
      background: transparent;
      cursor: pointer;
      color: var(--md-sys-color-on-surface);
      transition: all 0.15s;
    }
    .filter-btn.active {
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-color: var(--md-sys-color-primary);
    }

    .result-count {
      font-size: 13px;
      color: var(--md-sys-color-on-surface-variant);
      padding: 0 32px 12px;
    }

    main { padding: 20px 32px 48px; max-width: 1400px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }
    .card {
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 12px;
      overflow: hidden;
      background: var(--md-sys-color-surface);
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: var(--md-sys-elevation-2); }
    .card.hidden { display: none; }
    .card-media {
      width: 100%; aspect-ratio: 1;
      background: var(--md-sys-color-surface-variant);
    }
    .card-media img { width: 100%; height: 100%; object-fit: contain; padding: 12px; }
    .card-content { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
    .tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag {
      font-size: 10px; font-weight: 500;
      padding: 2px 8px;
      border-radius: 100px;
    }
    .tag-country { background: #E8DEF8; color: #381E72; }
    .tag-category { background: #D3E4CD; color: #1A3B2A; }
    .file-name { font-size: 12px; font-weight: 500; word-break: break-all; }
    .download-btn {
      display: inline-block; padding: 6px 12px;
      background: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      border-radius: 100px; font-size: 11px; font-weight: 500;
      text-decoration: none; text-align: center;
      transition: opacity 0.2s;
    }
    .download-btn:hover { opacity: 0.85; }
    .no-glb { font-size: 11px; color: var(--md-sys-color-on-surface-variant); }
    .empty { padding: 48px; text-align: center; color: var(--md-sys-color-on-surface-variant); grid-column: 1/-1; }

    @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <header>
    <h1>🍧 빙수 월드 투어 — 에셋 갤러리</h1>
    <p>사물 에셋 모음 · GLB 다운로드</p>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input type="text" id="search" placeholder="파일명 검색...">
    </div>
    <div class="filter-group" id="country-filters">
      <button class="filter-btn active" data-filter="country" data-value="ALL">전체</button>
    </div>
    <div class="filter-group" id="category-filters">
      <button class="filter-btn active" data-filter="category" data-value="ALL">전체 카테고리</button>
    </div>
  </div>

  <div class="result-count" id="result-count"></div>

  <main>
    <div class="grid" id="grid">
      
      <div class="empty hidden" id="empty">검색 결과가 없습니다.</div>
    </div>
  </main>

  <script>
    const cards = document.querySelectorAll('.card');
    const search = document.getElementById('search');
    const resultCount = document.getElementById('result-count');
    const empty = document.getElementById('empty');

    // 필터 버튼 동적 생성
    const countries  = [...new Set([...cards].map(c => c.dataset.country))].sort();
    const categories = [...new Set([...cards].map(c => c.dataset.category))].sort();

    const countryWrap  = document.getElementById('country-filters');
    const categoryWrap = document.getElementById('category-filters');

    countries.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.filter = 'country';
      btn.dataset.value = v;
      btn.textContent = v;
      countryWrap.appendChild(btn);
    });

    categories.forEach(v => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.dataset.filter = 'category';
      btn.dataset.value = v;
      btn.textContent = v;
      categoryWrap.appendChild(btn);
    });

    let activeCountry  = 'ALL';
    let activeCategory = 'ALL';

    function updateCards() {
      const q = search.value.toLowerCase();
      let visible = 0;
      cards.forEach(card => {
        if (card.id === 'empty') return;
        const matchName     = card.dataset.name.toLowerCase().includes(q);
        const matchCountry  = activeCountry  === 'ALL' || card.dataset.country  === activeCountry;
        const matchCategory = activeCategory === 'ALL' || card.dataset.category === activeCategory;
        const show = matchName && matchCountry && matchCategory;
        card.classList.toggle('hidden', !show);
        if (show) visible++;
      });
      resultCount.textContent = `${visible}개 에셋`;
      empty.classList.toggle('hidden', visible > 0);
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.filter;
        document.querySelectorAll(`[data-filter="${group}"]`).forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (group === 'country')  activeCountry  = btn.dataset.value;
        if (group === 'category') activeCategory = btn.dataset.value;
        updateCards();
      });
    });

    search.addEventListener('input', updateCards);
    updateCards();
  </script>
</body>
</html>
