<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>빙수 월드 투어 — 에셋 갤러리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans KR', sans-serif; }
    .card:hover { transform: translateY(-2px); transition: transform 0.2s; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Header -->
  <header class="bg-white border-b border-gray-200 px-8 py-5">
    <h1 class="text-xl font-bold text-gray-900">🍧 빙수 월드 투어 — 에셋 갤러리</h1>
    <p class="text-sm text-gray-500 mt-1">사물 에셋 모음 · 썸네일 확인 후 GLB 다운로드</p>
  </header>

  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-56 shrink-0 bg-white border-r border-gray-200 min-h-screen p-5">
      <div class="mb-6">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">검색</h2>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input id="search" type="text" placeholder="파일명 검색..."
            class="w-full pl-9 pr-3 py-2 text-sm border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-violet-500">
        </div>
      </div>

      <div>
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">국가 필터</h2>
        <div id="country-filters" class="space-y-2"></div>
      </div>

      <div class="mt-6">
        <p class="text-xs text-gray-400" id="result-count"></p>
      </div>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-6">
      <div id="grid" class="grid grid-cols-4 gap-4"></div>
      <div id="empty" class="hidden text-center py-20 text-gray-400">검색 결과가 없습니다.</div>
      <div id="loading" class="text-center py-20 text-gray-400">에셋 불러오는 중...</div>
    </main>
  </div>

  <script>
    const GITHUB_USER = "parkseongkeun";
    const REPO_NAME   = "bingsu-asset-gallery";
    const RAW_BASE    = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/main/assets`;
    const API_BASE    = `https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/assets`;

    let allCards = [];
    let activeCountries = new Set(['ALL']);

    async function loadAssets() {
      try {
        const res  = await fetch(API_BASE);
        const files = await res.json();

        const pngs = files.filter(f => f.name.endsWith('.png'));
        const glbs = new Set(files.filter(f => f.name.endsWith('.glb')).map(f => f.name));

        allCards = pngs.map(f => {
          const name    = f.name.replace('.png', '');
          const parts   = name.split('_');
          const country = name.startsWith('COMMON') ? 'COMMON' : parts[0];
          return {
            name,
            country,
            imgUrl: `${RAW_BASE}/${f.name}`,
            glbUrl: glbs.has(f.name.replace('.png', '.glb')) ? `${RAW_BASE}/${f.name.replace('.png', '.glb')}` : null,
          };
        });

        buildFilters();
        renderCards();
        document.getElementById('loading').classList.add('hidden');
      } catch(e) {
        document.getElementById('loading').textContent = '불러오기 실패: ' + e.message;
      }
    }

    function buildFilters() {
      const countries = ['ALL', ...new Set(allCards.map(c => c.country))].sort();
      const wrap = document.getElementById('country-filters');
      wrap.innerHTML = '';
      countries.forEach(c => {
        const label = document.createElement('label');
        label.className = 'flex items-center gap-2 cursor-pointer text-sm text-gray-700 hover:text-violet-600';
        label.innerHTML = `
          <input type="checkbox" class="country-cb accent-violet-600 w-4 h-4" value="${c}" ${c === 'ALL' ? 'checked' : ''}>
          <span>${c}</span>`;
        wrap.appendChild(label);
      });

      document.querySelectorAll('.country-cb').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.value === 'ALL') {
            activeCountries = cb.checked ? new Set(['ALL']) : new Set();
            document.querySelectorAll('.country-cb').forEach(b => { if (b.value !== 'ALL') b.checked = false; });
          } else {
            document.querySelector('.country-cb[value="ALL"]').checked = false;
            activeCountries.delete('ALL');
            if (cb.checked) activeCountries.add(cb.value);
            else activeCountries.delete(cb.value);
          }
          renderCards();
        });
      });
    }

    function renderCards() {
      const q = document.getElementById('search').value.toLowerCase();
      const grid = document.getElementById('grid');
      const empty = document.getElementById('empty');
      grid.innerHTML = '';

      const filtered = allCards.filter(c => {
        const matchName    = c.name.toLowerCase().includes(q);
        const matchCountry = activeCountries.has('ALL') || activeCountries.has(c.country);
        return matchName && matchCountry;
      });

      document.getElementById('result-count').textContent = `${filtered.length}개 에셋`;
      empty.classList.toggle('hidden', filtered.length > 0);

      filtered.forEach(c => {
        const dlBtn = c.glbUrl
          ? `<a href="${c.glbUrl}" download class="block w-full text-center bg-violet-600 hover:bg-violet-700 text-white text-xs font-medium py-1.5 rounded-lg transition-colors">GLB 다운로드</a>`
          : `<span class="block w-full text-center text-xs text-gray-400">GLB 준비 중</span>`;

        const card = document.createElement('div');
        card.className = 'card bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm';
        card.innerHTML = `
          <div class="aspect-square bg-gray-50 overflow-hidden">
            <img src="${c.imgUrl}" alt="${c.name}" loading="lazy" class="w-full h-full object-contain p-3">
          </div>
          <div class="p-3 space-y-2">
            <span class="inline-block text-xs bg-violet-100 text-violet-700 font-medium px-2 py-0.5 rounded-full">${c.country}</span>
            <p class="text-xs font-medium text-gray-800 break-all leading-snug">${c.name}</p>
            ${dlBtn}
          </div>`;
        grid.appendChild(card);
      });
    }

    document.getElementById('search').addEventListener('input', renderCards);
    loadAssets();
  </script>
</body>
</html>
